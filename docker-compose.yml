services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
      AUTH_API_DB_PASSWORD: ${AUTH_API_DB_PASSWORD}
    command: postgres -c shared_preload_libraries=pg_stat_statements
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v16.2
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_AUD: postgrest
      PGRST_OPENAPI_MODE: ignore-privileges
      PGRST_OPENAPI_SECURITY_ACTIVE: "true"
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:${PGRST_PORT}
    ports:
      - '${PGRST_PORT}:3000'
    depends_on:
      postgres:
        condition: service_healthy

  auth-api:
    build: ./auth-api
    environment:
      PORT: 4000
      DATABASE_URL: postgres://auth_api:${AUTH_API_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: info
    ports:
      - '${AUTH_API_PORT}:4000'
    depends_on:
      postgres:
        condition: service_healthy

  swagger:
    image: swaggerapi/swagger-ui:v5.32.15
    environment:
      URLS: '[{"url":"http://localhost:${AUTH_API_PORT}/openapi.json","name":"auth-api"},{"url":"http://localhost:${PGRST_PORT}/","name":"postgrest"}]'
      URLS_PRIMARY_NAME: auth-api
    ports:
      - '${SWAGGER_PORT}:8080'
    depends_on:
      - auth-api
      - postgrest

volumes:
  pgdata:
